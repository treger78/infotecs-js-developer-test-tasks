<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="./src/styles.css">
    <title>Task 2 - Users</title>
</head>
<body>
    <header>
        <h3>Task 2 - Users</h3>
    </header>

    <main>
        <div class="sorting-options">
            <label>
                <input type="checkbox" id="global-sort-checkbox" checked>
                Сортировать все данные (вне зависимости от текущей страницы)
            </label>
        </div>
        <div class="pagination-controls">
            <div class="pagination-settings">
                <label for="rows-per-page">Строк на странице:</label>
                <select id="rows-per-page">
                    <option value="5">5</option>
                    <option value="10" selected>10</option>
                    <option value="20">20</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                </select>
            </div>
            <div class="pagination-navigation">
                <button id="first-page">Первая</button>
                <button id="prev-page">Предыдущая</button>
                <span id="page-info"></span>
                <button id="next-page">Следующая</button>
                <button id="last-page">Последняя</button>
            </div>
        </div>
        <div id="users-table-container">
            <table id="users-table">
                <caption>Users table</caption>
                <thead>
                    <tr id="users-table-thead-row"></tr>
                </thead>
                <tbody id="users-table-tbody"></tbody>
            </table>
        </div>
    </main>

    <footer>implemented by Ilia Pustograev</footer>
    <script type="module" src="./src/app.js"></script>
</body>
</html>
