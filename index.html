<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="./src/styles.css">
    <title>Task 1 - Collage</title>
</head>
<body>
    <header>
        <h3>Task 1 - Collage</h3>
    </header>

    <main>
        <div id="imgLimitContainer">
            <label for="imgLimit">Задать лимит изображений:</label>
            <select name="imgLimit" id="imgLimit">
                <option value="2">2</option>
                <option value="3" selected>3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
            </select>
        </div>
        <div id="collage"></div>
        <div id="modal">
            <img id="modal-img" alt="Dog image">
            <button id="close-modal-btn">×</button>
            <button id="download-btn">Download</button>
        </div>
    </main>

    <footer>implemented by Ilia Pustograev</footer>
    <script src="./src/app.js"></script>
</body>
</html>
